server:
  port: 8082
  mode: debug # debug | release

database:
  host: localhost
  port: 5432
  user: admin
  password: "Postgres@2026"
  dbname: x_store
  sslmode: disable
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  db: 0

jwt:
  secret: x-store-jwt-secret-key-change-in-production
  expire_hours: 72

signature:
  secret: x-store-signature-secret-key-change-in-production
  expire_seconds: 60

email:
  enabled: false  # 设置为 true 启用邮件通知
  host: smtp.gmail.com
  port: 587
  username: your-email@gmail.com
  password: your-app-password
  from: X-Store <noreply@x-store.com>

# OAuth 配置已迁移到数据库管理
# 请在管理后台「第三方登录」页面配置 GitHub/Google OAuth
